          </div>
        </div>

      <main id="main-content" class="workspace-content" tabindex="-1">
        <header class="library-heading"><div><h1>我的生词本</h1><p class="library-subtitle">从喜欢的故事里，积累自己的表达。</p></div></header>
        <div class="library-toolbar">
          <div class="book-search" role="search"><svg class="book-icon" aria-hidden="true"><use href="#icon-search"/></svg><input type="search" id="search" placeholder="搜索词语、译文或影片" aria-label="搜索生词" autocomplete="off" aria-controls="word-list"><kbd id="search-shortcut" aria-hidden="true">⌘ K</kbd><button type="button" id="clear-search" class="icon-button clear-search" aria-label="清除搜索" title="清除搜索" hidden><svg class="book-icon" aria-hidden="true"><use href="#icon-close"/></svg></button></div>
          <div class="mobile-filter"><select id="collection-filter" aria-label="筛选收藏"><option value="all">全部收藏</option><option value="today">今日收藏</option></select><svg class="book-icon chevron" aria-hidden="true"><use href="#icon-chevron"/></svg></div>
          <div class="sort-control"><svg class="book-icon" aria-hidden="true"><use href="#icon-sort"/></svg><select id="sort" aria-label="排序方式"><option value="newest">最近收藏</option><option value="oldest">最早收藏</option><option value="term">按词语排序</option></select><svg class="book-icon chevron" aria-hidden="true"><use href="#icon-chevron"/></svg></div>
        </div>

        <div class="load-message" id="load-message" hidden><p id="message" role="status"></p><button type="button" id="retry-load">重新加载</button></div>
        <div class="loading-state" id="loading" role="status"><span class="loading-dot" aria-hidden="true"></span>正在整理你的收藏…</div>
        <section id="word-list" class="word-list" aria-label="收藏列表" aria-busy="true"></section>
